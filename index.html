#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.crt{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:4px}
.screen{position:relative;background:#000;border-radius:14px;overflow:hidden;contain:layout paint;

.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 50%,transparent 58%,rgba(0,0,0,.48) 100%)}
.glare{position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.07) 0 12%,transparent 30%)}

.dmg.on{opacity:1}

.dg.up{left:45px;top:0}.dg.up::after{border-bottom-color:#9fd8ff;border-top:0}
.dg.down{left:45px;top:90px}.dg.down::after{border-top-color:#9fd8ff;border-bottom:0}
.dg.left{left:0;top:45px}.dg.left::after{border-right-color:#9fd8ff;border-left:0}
.dg.right{left:90px;top:45px}.dg.right::after{border-left-color:#9fd8ff;border-right:0}

.abc{display:flex;gap:12px;align-items:flex-end;pointer-events:none}
.cb{width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;position:relative;pointer-events:auto;touch-action:none;font:900 20px/1 ui-monospace,monospace;color:#081018;box-shadow:0 5px 0 rgba(0,0,0,.55),inset 0 3px 0 rgba(255,255,255,.5),inset 0 -6px 10px rgba(0,0,0,.28)}

.cb.a{background:radial-gradient(80% 80% at 40% 30%,#c9ffd6,#39d97a 60%,#1d9a52)}
.cb.b{background:radial-gradient(80% 80% at 40% 30%,#ffd6cf,#ff5a4a 60%,#c22a22);margin-bottom:16px}

 if(paused)return;
 if(hitstop>0){hitstop--;updParts();return;}
 updWorld();updPlayer();gridBuild(foes);updFoes();updBullets();updItems();updParts();updBoss();
 const p=pl;
 if(p){const ax=(lvl.w-ARENA)*TS;
  if(!cam.lock&&p.x>ax&&!boss){spawnBoss(lvl.boss);cam.lock=true;}
  cam.look=lerp(cam.look,clamp(p.vx*10,-40,40),.06);
  const tg=cam.lock?(lvl.w*TS-W):clamp(p.x-W*.38+cam.look,0,lvl.w*TS-W);
  cam.x=clamp(lerp(cam.x,tg,cam.lock?.07:.17),0,Math.max(0,lvl.w*TS-W));
  if(cam.lock)p.x=clamp(p.x,ax+4,lvl.w*TS-BW-4);}
 if(p&&p.dead&&deadT>66){
  if(lives<=0){state='gameover';SND.play('dead');SND.music('menu');if(score>hi){hi=score;try{localStorage.setItem('bf_hi',String(hi));}catch(_){}}}
  else{const kw=p.weapon,ks=p.spec;pl=mkPlayer(CHARS[sel]);pl.weapon=kw;pl.spec=ks;
   pl.x=clamp(cam.x+50,20,lvl.w*TS-50);pl.px=pl.x;pl.y=90;pl.py=90;pl.inv=110;deadT=0;}}
 if(clearT>0){clearT++;if(clearT>170){
  if(si>=LEVELS.length-1){state='victory';SND.music('win');if(score>hi){hi=score;try{localStorage.setItem('bf_hi',String(hi));}catch(_){}}}
  else loadStage(si+1);}}}
function render(alpha){bind(g);g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';
 const cx=lerp(cam.px,cam.x,alpha),s=cam.shake>.4?cam.shake:0;
 g.save();if(s)g.translate(Math.round(rnd(-s,s)),Math.round(rnd(-s,s)));
 if(state==='title')drawTitle();
 else if(state==='select')drawSelect();
 else if(state==='intro')drawIntro();
 else if(state==='gameover'){if(lvl){drawSky();drawPar(cx);drawTiles(cx);}drawOver();}
 else if(state==='victory')drawWin();
 else if(lvl){drawSky();drawPar(cx);drawTiles(cx);drawMovers();drawWarnings();drawItems();
  for(let i=0;i<foes.length;i++)drawFoe(foes[i],alpha);
  if(boss)drawBoss();if(pl&&!pl.dead)drawChar(pl,alpha);
  drawFlames();drawBullets(alpha);drawParts(alpha);drawWeather();drawHUD();
  if(clearT>0){px(0,100,W,50,'rgba(7,10,16,.84)');px(0,100,W,2,P.yl2);px(0,148,W,2,P.yl2);
   txtCSh('ЗОНА ЗАЧИЩЕНА',W/2,108,P.yl2,2);txtCSh('БОНУС '+BOSSES[lvl.boss].score,W/2,132,P.cy2,1);}
  if(paused)drawPause();}
 else drawTitle();
 g.restore();
 if(flash>0){g.fillStyle='rgba(255,255,255,'+(flash/12).toFixed(2)+')';g.fillRect(0,0,W,H);}
 vis.drawImage(buf,0,0,W,H);}
function drawErr(){bind(g);g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;
 px(0,H-26,W,26,'rgba(40,4,4,.94)');px(0,H-26,W,1,P.rd2);
 txtSh('СБОЙ: '+String(err).slice(0,68),4,H-22,P.rd1,1);txtSh('НАЖМИ СТАРТ ДЛЯ СБРОСА',4,H-12,P.g3,1);
 vis.drawImage(buf,0,0,W,H);}
let last=0,acc=0,running=false;
function loop(t){requestAnimationFrame(loop);
 if(!gfxOk){try{Spr.init();gfxOk=Spr.ready;err=null;}catch(e){err='GFX '+(e&&e.message?e.message:e);}
  if(!gfxOk){drawErr();return;}}
 if(!last)last=t;let dt=(t-last)/1000;last=t;if(dt>.12)dt=.12;
 pollInput();acc+=dt;if(acc>.25)acc=.25;let n=0;
 while(acc>=STEP&&n<4){acc-=STEP;n++;try{update();}catch(e){if(!err){err='SIM '+(e&&e.message?e.message:e);console.error(e);}}}
 if(err&&peek('start')){KE.start=false;err=null;state='title';paused=false;SND.music('menu');}
 const alpha=clamp(acc/STEP,0,1);
 try{render(alpha);}catch(e){if(!err){err='DRAW '+(e&&e.message?e.message:e);console.error(e);}}
 if(err)drawErr();}
function bindUI(){
 const bs=document.getElementById('bSound');
 bs.addEventListener('pointerdown',e=>{e.preventDefault();SND.unlock();const on=!SND.get();SND.set(on);
  bs.classList.toggle('off',!on);bs.textContent=on?'🔊':'🔇';},{passive:false});
 document.getElementById('bPause').addEventListener('pointerdown',e=>{e.preventDefault();if(state==='play'){paused=!paused;SND.play('ui');}},{passive:false});
 document.getElementById('bFull').addEventListener('pointerdown',e=>{e.preventDefault();
  const el=document.documentElement;
  if(!document.fullscreenElement)(el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el);else document.exitFullscreen();
  setTimeout(fit,240);},{passive:false});
 document.addEventListener('visibilitychange',()=>{
  if(document.hidden){SND.suspend();if(state==='play')paused=true;for(const k in K)K[k]=0;for(const k in PREV)PREV[k]=0;}
  else{SND.resume();last=0;acc=0;}});}
function boot(){if(running)return;running=true;
 IN.bindDom(document.getElementById('touch'));bindUI();SND.music('menu');
 fit();setTimeout(fit,160);setTimeout(fit,600);requestAnimationFrame(loop);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
