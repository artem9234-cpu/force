<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>BALBES FORCE</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div id="app">
  <div class="crt">
    <div class="screen" id="screen">
      <canvas id="cv" width="448" height="256"></canvas>
      <div class="scan"></div>
      <div class="vig"></div>
      <div class="glare"></div>
      <div class="dmg" id="dmg"></div>
      <div class="power" id="power"></div>
    </div>
  </div>

  <div class="float">
    <button id="bSound" class="fb" title="Звук">🔊</button>
    <button id="bPause" class="fb" title="Пауза">⏸</button>
    <button id="bFull"  class="fb" title="Во весь экран">⛶</button>
    <button id="bSvx" class="fb" title="Загрузить 8SVX/WAV">📁</button>
    <button id="bSvxMode" class="fb" title="Режим сэмпла">♫</button>
  </div>
  <span class="svx-info" id="svxInfo"></span>

  <div class="touch" id="touch">
    <div class="dpad" id="dpad">
      <span class="hub"></span>
      <button class="dg up"    data-k="up"></button>
      <button class="dg down"  data-k="down"></button>
      <button class="dg left"  data-k="left"></button>
      <button class="dg right" data-k="right"></button>
    </div>
    <div class="abc">
      <button class="cb c" data-k="spec">C</button>
      <button class="cb b" data-k="fire">B</button>
      <button class="cb a" data-k="jump">A</button>
    </div>
  </div>

  <div class="keys" id="keys">← → бег · ↑ прицел · ↓ лёжа · ↓+X спрыгнуть · Z огонь · X прыжок · C приём · P пауза</div>
</div>
<input type="file" id="svxFile" accept=".8svx,.svx,.iff,.wav,.mp3,.ogg,.bin" hidden>
<script src="js/core.js?v=5"></script>
<script src="js/svx.js?v=5"></script>
<script src="js/gfx.js?v=5"></script>
<script src="js/data.js?v=5"></script>
<script src="js/game.js?v=5"></script>
</body>
</html>
